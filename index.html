<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta Dev - Fernanda Kauak Alaff</title>

    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main>
        <section class="carta-batalla">
            <article>
                <div class="avatar">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=fer" alt="Avatar Fer" />
                </div>
                <div class="title-card">
                    <h1>Fernanda Kauak</h1>
                    <h2>Front-End</h2>
                </div>
            </article>

            <article class="estadistica-set">
                <h3>Estadísticas</h3>
                <div class="estadistica">
                    <div class="html_bar">HTML</div>
                </div>
                <div class="estadistica">
                    <div class="css_bar">CSS</div>
                </div>
                <div class="estadistica">
                    <div class="js_bar">JavaScript</div>
                </div>
            </article>

            <article class="habilidad">
                <div class="img-hab">
                    <p>Habilidad Especial</p>
                    <img src="modo-catastrofe.jpg" alt="Modo Catastrofe" />
                </div>
             
                <h2>Modo Catástrofe</h2>
                <p>Hace código corriendo en círculos.
                </br>No la actives mucho, vive sin estrés.</p>
                <p id="contador" class="contar">Sin Activar</p>
            </article>
            
            <article class="rareza">
                <h2>Rareza</h2>
                <h3>Redundantemente Raro</h3>
            </article>

            <button type="button" id="activarHab">Activar Habilidad</button>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
